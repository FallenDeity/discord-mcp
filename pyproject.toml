[project]
name = "discord-mcp"
version = "0.1.0"
description = ""
authors = [
    { name = "FallenDeity", email = "61227305+FallenDeity@users.noreply.github.com" },
    { name = "Snipy7374", email = "100313469+Snipy7374@users.noreply.github.com" },
]
requires-python = ">=3.12,<4"
readme = "README.md"
dependencies = [
    "pytest>=8.4.1,<9",
    "click>=8.2.1,<9",
    "discord-py>=2.5.2,<3",
    "python-dotenv>=1.1.1,<2",
    "docstring-parser>=0.17.0,<0.18",
    "aiosqlite>=0.21.0,<0.22",
    "mcp>=1.25.0",
]

[dependency-groups]
dev = [
    "isort>=6.0.1,<7",
    "black>=25.1.0,<26",
    "pre-commit>=4.2.0,<5",
    "pyright>=1.1.403,<2",
    "ruff>=0.12.4,<0.13",
    "pytest>=8.4.1,<9",
]

[tool.uv]
package = true

[tool.hatch.build.targets.sdist]
include = ["src/discord_mcp"]

[tool.hatch.build.targets.wheel]
include = ["src/discord_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/discord_mcp" = "discord_mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true


[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportImportCycles = false
reportPrivateUsage = false
reportPrivateImportUsage = false
reportMissingModuleSource = false
reportMissingTypeStubs = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
pythonpath = ["src"]
console_output_style = "progress"
